{% extends "base.html" %}{% block title %}Party Planner{% endblock %}{% block content %}
<section class="page-head"><p class="eyebrow">EVENT PLANNING</p><h1>Plan your party</h1><p>Allocate your budget across food, venue and decoration.</p></section>
<form id="party-form" class="card planner-form" {% if multipart %}enctype="multipart/form-data"{% endif %}><div class="form-grid">
<label>Budget (₹)<input type="number" name="budget" min="100" required></label><label>Guests<input type="number" name="guests" min="1" max="5000" value="20" required></label><label>Event<select name="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option></select></label><label>Venue<select name="venue"><option>Home</option><option>Restaurant</option><option>Hall</option></select></label><label>Notes<textarea name="notes"></textarea></label></div><button class="btn primary">Generate Plan</button><p id="planner-message" class="message"></p></form><div id="results"></div>
{% endblock %}{% block scripts %}<script>setupPlannerForm("party-form","/api/generate-party")</script>{% endblock %}
