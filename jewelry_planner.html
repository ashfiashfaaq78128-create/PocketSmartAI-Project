{% extends "base.html" %}{% block title %}Jewelry Planner{% endblock %}{% block content %}
<section class="page-head"><p class="eyebrow">OCCASION & STYLE</p><h1>Find matching jewelry</h1><p>Optionally upload an outfit image for Gemini to consider colors and style.</p></section>
<form id="jewelry-form" class="card planner-form" {% if multipart %}enctype="multipart/form-data"{% endif %}><div class="form-grid">
<label>Budget (₹)<input type="number" name="budget" min="100" required></label><label>Occasion<select name="occasion"><option>Casual</option><option>Wedding</option><option>Party</option><option>Traditional</option></select></label><label>Style<select name="style"><option>Minimal</option><option>Elegant</option><option>Statement</option><option>Traditional</option></select></label><label>Metal<select name="metal"><option>Any</option><option>Gold-tone</option><option>Silver-tone</option><option>Pearl</option></select></label><label>Outfit image<input type="file" name="outfit_image" accept="image/png,image/jpeg,image/webp"></label><label>Notes<textarea name="notes"></textarea></label></div><button class="btn primary">Generate Plan</button><p id="planner-message" class="message"></p></form><div id="results"></div>
{% endblock %}{% block scripts %}<script>setupPlannerForm("jewelry-form","/api/generate-jewelry")</script>{% endblock %}
